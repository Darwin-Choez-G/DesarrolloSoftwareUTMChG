<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPORTE DE INCIDENTES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    
</head> 


<body>
    <header>
        <h1>REPORTAR INCIDENTES</h1>
        <img src="imagen/Reportes1.png" class="img-fluid card-imag"
         alt="Gestor de Incidentes">
    </header>

    <nav>
        <ul class="nav-bar">
            <li> <a href="/index.html">Inicio</a></li>
            <li><a href="/reportar.html">Reportar Incidentes</a></li>
            <li><a href="/tickets.html">Tickets</a></li>
        </ul>
    </nav>
    <main>
       <div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class=" card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center">
                    <h2 class="mb-0">Formulario de Registro de Incidentes</h2>
                </div>
                   <div class="card-body">
                    <p class="text-muted">
                        Complete el siguiente formulario para registrar un incidente en el sistema Help Desk.
                    </p>

                    <form action="#" method="post">

                        <!-- Título -->
                        <div class="mb-3">
                            <label for="titulo" class="form-label">
                                Título del incidente
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="titulo"
                                name="titulo"
                                placeholder="Ingrese el título del incidente"
                                required>
                        </div>

                        <!-- Categoría -->
                        <div class="mb-3">

                            <label for="categoria" class="form-label">
                                Categoría
                            </label>

                            <select class="form-select" id="categoria" name="categoria">

                                <option selected disabled>
                                    Seleccione una categoría
                                </option>

                                <option value="Red">Red</option>

                                <option value="Hardware">Hardware</option>

                                <option value="Software">Software</option>

                            </select>

                        </div>

                        <!-- Prioridad -->
                        <div class="mb-3">

                            <label class="form-label d-block">
                                Prioridad
                            </label>

                            <div class="d-flex flex-wrap gap-3">

                                <div class="form-check">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="prioridad"
                                           id="alta"
                                           value="Alta">

                                    <label class="form-check-label" for="alta">
                                        Alta
                                    </label>

                                </div>

                                <div class="form-check">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="prioridad"
                                           id="media"
                                           value="Media">

                                    <label class="form-check-label" for="media">
                                        Media
                                    </label>

                                </div>

                                <div class="form-check">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="prioridad"
                                           id="baja"
                                           value="Baja">
                                    <label class="form-check-label" for="baja">
                                        Baja
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="descripcion" class="form-label">
                                Descripción detallada
                            </label>
                           <textarea
                                class="form-control"
                                id="descripcion"
                                name="descripcion"
                                rows="5"
                                placeholder="Ingrese la descripción detallada del incidente"
                                required></textarea>
                        </div>

                        <div class="d-flex flex-column flex-md-row justify-content-end gap-2">
                            <button type="reset" class="btn btn-outline-info">
                                Limpiar
                            </button>
                            <button type="submit" class="btn btn-outline-success">
                                Enviar Reporte
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

       </main>
      <footer class="informer">
            <br><br>
            <p> @2026 Gestor de Incidentes: reprteincidentehelpdesk@report.com</p>
           <p><b>@ autor:</b> Chóez González Darwin</p>
     </footer>
</body>
</html>
